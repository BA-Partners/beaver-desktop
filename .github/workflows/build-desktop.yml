name: build-desktop

# 一条命令产出 Windows / macOS / Linux 三端安装包
# 触发：手动运行，或打 tag（如 desktop-v2.2.58）
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            command: npx electron-builder --linux AppImage tar.gz
          - os: windows-latest
            name: windows
            command: npx electron-builder --win nsis
          - os: macos-latest
            name: macos
            command: npx electron-builder --mac dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: ${{ matrix.command }} 2>&1 | tee build.log
        shell: bash
        env:
          # 未配置证书时不要自动签名：否则 electron-builder 会把空的 CSC_LINK
          # 当成证书路径，直接报 "<cwd> not a file"。
          # 需要签名时在仓库 Secrets 里配置证书，并把下面改成 'true' + 传入 CSC_LINK。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: beaver-desktop-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 失败时公开回写日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch (e) {
              log = '（没有 build.log：' + e + '）';
            }
            const tail = log.slice(-6000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### CI 打包失败日志（自动回写）\n\n```\n' + tail + '\n```',
            });

      # 打 tag 时把安装包挂到 Release，任何人都能直接下载（无需登录）
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 圆梦同行 桌面版 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
