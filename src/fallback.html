<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'" />
  <title>圆梦同行 - 连接失败</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: linear-gradient(160deg, #fff6f1 0%, #f2f3f5 100%);
      color: #2d3436;
    }
    .card {
      width: 420px; max-width: 90vw; padding: 32px 28px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .08);
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px;
      background: #ff7d45; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px; font-weight: 700;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #8a97a3; line-height: 1.7; margin: 0 0 6px; }
    code { font-size: 12px; color: #b2bec3; word-break: break-all; }
    .row { display: flex; gap: 10px; margin-top: 22px; }
    button {
      flex: 1; padding: 11px 0; font-size: 14px; border-radius: 10px;
      border: 1px solid #e6e8eb; background: #fff; color: #636e72; cursor: pointer;
    }
    button.primary { background: #ff7d45; border-color: #ff7d45; color: #fff; font-weight: 600; }
    button:hover { filter: brightness(.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">圆</div>
    <h1>无法连接到服务器</h1>
    <p>请检查网络或稍后重试。本客户端需要在联网状态下使用。</p>
    <p><code id="detail"></code></p>
    <div class="row">
      <button id="openWeb">用浏览器打开</button>
      <button class="primary" id="retry">重试</button>
    </div>
  </div>
  <script src="./fallback.js"></script>
</body>
</html>
