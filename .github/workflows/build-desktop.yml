name: build-desktop

# 一条命令产出 Windows / macOS / Linux 三端安装包
# 触发：手动运行，或打 tag（如 desktop-v2.2.58）
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            command: npx electron-builder --linux AppImage tar.gz --publish never
          - os: windows-latest
            name: windows
            command: npx electron-builder --win nsis zip --publish never
          - os: macos-latest
            name: macos
            command: npx electron-builder --mac dmg zip --publish never
          # 下载页给 Intel 机型提供的 .zip 需要 x64 产物；
          # macos-latest 现在是 arm64 runner，所以单独加一条交叉编译 x64 的任务。
          - os: macos-latest
            name: macos-intel
            command: npx electron-builder --mac zip --x64 --publish never

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      # 只有仓库里配置了 MAC_CERT_P12_BASE64 才走签名分支，否则走未签名分支。
      # 这样既不会重演"空 CSC_LINK 被当成证书路径"的失败，也能在拿到证书后零改代码生效。
      - name: 检测签名证书
        id: signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已配置证书，本次将签名 + 公证"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置证书，产出未签名安装包"
          fi

      - name: 打包（未签名）
        if: steps.signing.outputs.enabled != 'true'
        run: ${{ matrix.command }} 2>&1 | tee build.log
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包（签名 + 公证）
        if: steps.signing.outputs.enabled == 'true'
        run: ${{ matrix.command }} ${{ matrix.name == 'macos' && '-c.mac.notarize=true' || '' }} 2>&1 | tee build.log
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        shell: bash
        run: ls -la dist || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: beaver-desktop-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 失败时公开回写日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch (e) {
              log = '（没有 build.log：' + e + '）';
            }
            const tail = log.slice(-6000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### CI 打包失败日志（自动回写）\n\n```\n' + tail + '\n```',
            });

      # 打 tag 时把安装包挂到 Release，任何人都能直接下载（无需登录）
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 圆梦同行 桌面版 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
